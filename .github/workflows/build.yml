on: [ push, pull_request ]
name: Build compact Alpha
jobs:
  build:
    name: OpenBubbles compact APK
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: amyu/setup-android@v5

      - name: Install Protobuf compiler
        run: sudo apt-get install -y protobuf-compiler

      - name: Set up fake Fairplay keys
        run: |
          mkdir -p rustpush/certs/fairplay

          cert_names=(
            "4056631661436364584235346952193"
            "4056631661436364584235346952194"
            "4056631661436364584235346952195"
            "4056631661436364584235346952196"
            "4056631661436364584235346952197"
            "4056631661436364584235346952198"
            "4056631661436364584235346952199"
            "4056631661436364584235346952200"
            "4056631661436364584235346952201"
            "4056631661436364584235346952208"
          )

          for name in "${cert_names[@]}"; do
              cp rustpush/certs/legacy-fairplay/fairplay.pem rustpush/certs/fairplay/$name.pem
              cp rustpush/certs/legacy-fairplay/fairplay.crt rustpush/certs/fairplay/$name.crt
          done

      - name: Build compact ARM64 Alpha APK
        run: flutter build apk --flavor alpha --profile --target-platform android-arm64

      - name: Report APK contents
        run: |
          ls -lh build/app/outputs/flutter-apk/app-alpha-profile.apk
          python3 - <<'PY'
          import collections
          import pathlib
          import zipfile

          apk = pathlib.Path("build/app/outputs/flutter-apk/app-alpha-profile.apk")
          print(f"APK exact bytes: {apk.stat().st_size}")
          with zipfile.ZipFile(apk) as archive:
              entries = archive.infolist()
              groups = collections.Counter()
              for entry in entries:
                  parts = entry.filename.split("/")
                  if entry.filename.startswith("lib/") and len(parts) > 2:
                      group = "/".join(parts[:2])
                  elif entry.filename.startswith("assets/flutter_assets/"):
                      group = "assets/flutter_assets"
                  else:
                      group = parts[0]
                  groups[group] += entry.compress_size

              print("\nLargest compressed groups:")
              for name, size in groups.most_common(20):
                  print(f"{size / 1024 / 1024:9.2f} MiB  {name}")

              print("\nLargest individual entries:")
              for entry in sorted(entries, key=lambda item: item.compress_size, reverse=True)[:30]:
                  print(f"{entry.compress_size / 1024 / 1024:9.2f} MiB  {entry.filename}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Compact Combined Alpha APK
          path: build/app/outputs/flutter-apk/app-alpha-profile.apk
